<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 492" role="img">
<title>Quatre types de fondations</title>
<desc>Semelle filante sous un mur, semelle isolée sous un poteau, radier sous tout le bâtiment, pieux qui descendent chercher un sol résistant en profondeur.</desc>
<style>text{font-family:'Space Grotesk',system-ui,sans-serif}.th{font-size:14px;font-weight:500}.ts{font-size:12px}.note{font-size:12px;fill:#5F5E5A}</style>
<rect width="680" height="492" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<rect x="40" y="24" width="290" height="206" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width=".5"/><text class="th" x="56" y="158" dominant-baseline="central" fill="#085041">Semelle filante</text><text class="ts" x="56" y="180" dominant-baseline="central" fill="#0F6E56">Sous un mur : une bande continue</text><text class="ts" x="56" y="198" dominant-baseline="central" fill="#0F6E56">Cas courant des petits bâtiments</text>
<path d="M60 84 H310" stroke="#0F6E56" stroke-width="1.5"/><rect x="178" y="40" width="14" height="44" fill="#0F6E56" fill-opacity=".12" stroke="#0F6E56" stroke-width="1.5"/><rect x="135" y="84" width="100" height="18" fill="#0F6E56" fill-opacity=".25" stroke="#0F6E56" stroke-width="1.5"/>
<rect x="350" y="24" width="290" height="206" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width=".5"/><text class="th" x="366" y="158" dominant-baseline="central" fill="#712B13">Semelle isolée</text><text class="ts" x="366" y="180" dominant-baseline="central" fill="#993C1D">Sous un poteau : un plot de béton</text><text class="ts" x="366" y="198" dominant-baseline="central" fill="#993C1D">Reliées entre elles par des longrines</text>
<path d="M370 84 H620" stroke="#993C1D" stroke-width="1.5"/><rect x="410" y="40" width="14" height="44" fill="#993C1D" fill-opacity=".12" stroke="#993C1D" stroke-width="1.5"/><rect x="394" y="84" width="46" height="18" fill="#993C1D" fill-opacity=".25" stroke="#993C1D" stroke-width="1.5"/><rect x="566" y="40" width="14" height="44" fill="#993C1D" fill-opacity=".12" stroke="#993C1D" stroke-width="1.5"/><rect x="550" y="84" width="46" height="18" fill="#993C1D" fill-opacity=".25" stroke="#993C1D" stroke-width="1.5"/><rect x="440" y="88" width="110" height="8" fill="#993C1D" fill-opacity=".1" stroke="#993C1D" stroke-width="1.2" stroke-dasharray="4 3"/>
<rect x="40" y="246" width="290" height="206" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".5"/><text class="th" x="56" y="380" dominant-baseline="central" fill="#444441">Radier</text><text class="ts" x="56" y="402" dominant-baseline="central" fill="#5F5E5A">Une dalle sous tout le bâtiment</text><text class="ts" x="56" y="420" dominant-baseline="central" fill="#5F5E5A">Utile quand le sol porte peu</text>
<path d="M60 306 H310" stroke="#5F5E5A" stroke-width="1.5"/><rect x="100" y="266" width="14" height="40" fill="#5F5E5A" fill-opacity=".12" stroke="#5F5E5A" stroke-width="1.5"/><rect x="256" y="266" width="14" height="40" fill="#5F5E5A" fill-opacity=".12" stroke="#5F5E5A" stroke-width="1.5"/><rect x="90" y="306" width="190" height="14" fill="#5F5E5A" fill-opacity=".25" stroke="#5F5E5A" stroke-width="1.5"/>
<rect x="350" y="246" width="290" height="206" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width=".5"/><text class="th" x="366" y="380" dominant-baseline="central" fill="#0C447C">Pieux</text><text class="ts" x="366" y="402" dominant-baseline="central" fill="#185FA5">Fondation profonde : on descend loin</text><text class="ts" x="366" y="420" dominant-baseline="central" fill="#185FA5">Quand le sol de surface est mauvais</text>
<path d="M370 306 H620" stroke="#185FA5" stroke-width="1.5"/><rect x="410" y="266" width="14" height="40" fill="#185FA5" fill-opacity=".12" stroke="#185FA5" stroke-width="1.5"/><rect x="566" y="266" width="14" height="40" fill="#185FA5" fill-opacity=".12" stroke="#185FA5" stroke-width="1.5"/><rect x="400" y="306" width="190" height="10" fill="#185FA5" fill-opacity=".25" stroke="#185FA5" stroke-width="1.5"/><rect x="414" y="316" width="8" height="48" fill="#185FA5" fill-opacity=".25" stroke="#185FA5" stroke-width="1.5"/><rect x="491" y="316" width="8" height="48" fill="#185FA5" fill-opacity=".25" stroke="#185FA5" stroke-width="1.5"/><rect x="568" y="316" width="8" height="48" fill="#185FA5" fill-opacity=".25" stroke="#185FA5" stroke-width="1.5"/><path d="M370 364 H620" stroke="#185FA5" stroke-width="1" stroke-dasharray="4 3"/>
<text class="note" x="40" y="476">Les trois premières sont dites superficielles ; les pieux sont dits profonds.</text>
</svg>
