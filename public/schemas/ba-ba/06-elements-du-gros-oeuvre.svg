<rect x="430" y="40" width="214" height="48" rx="8" fill="#5F5E5A" fill-opacity=".08" stroke="#5F5E5A" stroke-width=".5"/><text class="th" x="442" y="56" dominant-baseline="central" fill="#2C2C2A">Charpente et couverture</text><text class="ts" x="442" y="74" dominant-baseline="central" fill="#5F5E5A">Charpente bois ou métal, tuiles</text>
<rect x="430" y="98" width="214" height="48" rx="8" fill="#993C1D" fill-opacity=".08" stroke="#993C1D" stroke-width=".5"/><text class="th" x="442" y="114" dominant-baseline="central" fill="#2C2C2A">Planchers et chaînages</text><text class="ts" x="442" y="132" dominant-baseline="central" fill="#993C1D">Dalle ceinturée par un chaînage</text>
<rect x="430" y="156" width="214" height="48" rx="8" fill="#0F6E56" fill-opacity=".08" stroke="#0F6E56" stroke-width=".5"/><text class="th" x="442" y="172" dominant-baseline="central" fill="#2C2C2A">Murs porteurs</text><text class="ts" x="442" y="190" dominant-baseline="central" fill="#0F6E56">Portent planchers et toiture</text>
<rect x="430" y="214" width="214" height="48" rx="8" fill="#993C1D" fill-opacity=".08" stroke="#993C1D" stroke-width=".5"/><text class="th" x="442" y="230" dominant-baseline="central" fill="#2C2C2A">Linteau</text><text class="ts" x="442" y="248" dominant-baseline="central" fill="#993C1D">Poutre sur une ouverture</text>
<rect x="430" y="272" width="214" height="48" rx="8" fill="#993C1D" fill-opacity=".08" stroke="#993C1D" stroke-width=".5"/><text class="th" x="442" y="288" dominant-baseline="central" fill="#2C2C2A">Escalier</text><text class="ts" x="442" y="306" dominant-baseline="central" fill="#993C1D">Relie les niveaux</text>
<rect x="430" y="330" width="214" height="48" rx="8" fill="#5F5E5A" fill-opacity=".08" stroke="#5F5E5A" stroke-width=".5"/><text class="th" x="442" y="346" dominant-baseline="central" fill="#2C2C2A">Fondations</text><text class="ts" x="442" y="364" dominant-baseline="central" fill="#5F5E5A">Reprennent les charges</text>
<text class="note" x="40" y="424">Coupe simplifiée : ordre de grandeur, pas un plan d'exécution.</text>
</svg>
