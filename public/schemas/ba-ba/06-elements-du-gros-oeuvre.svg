<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" role="img">
<title>Les éléments du gros œuvre en coupe</title>
<desc>Coupe d'un bâtiment : fondation, mur porteur, plancher en béton avec chaînage, linteau au-dessus d'une ouverture, escalier, charpente et couverture.</desc>
<style>text{font-family:'Space Grotesk',system-ui,sans-serif}.th{font-size:14px;font-weight:500}.ts{font-size:12px}.note{font-size:12px;fill:#5F5E5A}</style>
<rect width="680" height="440" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<path d="M30 372 H400" stroke="#5F5E5A" stroke-width="1.5"/>
<rect x="60" y="372" width="60" height="22" fill="#5F5E5A" fill-opacity=".25" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/><rect x="300" y="372" width="60" height="22" fill="#5F5E5A" fill-opacity=".25" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
