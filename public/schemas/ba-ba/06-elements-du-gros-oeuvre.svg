<rect x="80" y="262" width="20" height="8" fill="#993C1D" stroke="#993C1D" stroke-width="1"/><rect x="320" y="262" width="20" height="8" fill="#993C1D" stroke="#993C1D" stroke-width="1"/>
<rect x="80" y="152" width="20" height="8" fill="#993C1D" stroke="#993C1D" stroke-width="1"/><rect x="320" y="152" width="20" height="8" fill="#993C1D" stroke="#993C1D" stroke-width="1"/>
<rect x="76" y="308" width="28" height="46" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="72" y="300" width="36" height="8" fill="#993C1D" fill-opacity=".35" stroke="#993C1D" stroke-width="1.5"/>
<path d="M150 372 L150 354 L172 354 L172 336 L194 336 L194 318 L216 318 L216 300 L238 300 L238 284 L250 284" stroke="#993C1D" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
