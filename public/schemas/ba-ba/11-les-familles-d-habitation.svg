<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img">
<title>Les familles d'habitation et la stabilité au feu</title>
<desc>Cinq immeubles de hauteurs croissantes. 1re famille : maisons de R+1 au plus, stabilité au feu de 15 minutes. 2e famille : collectifs de R+3 au plus, 30 minutes. 3e famille : jusqu'à 28 m, 1 heure. 4e famille : de 28 à 50 m, 1 heure 30. Au-dessus de 50 m : immeubles de grande hauteur, règles spécifiques.</desc>
<style>text{font-family:'Space Grotesk',system-ui,sans-serif}.th{font-size:14px;font-weight:500}.ts{font-size:12px}</style>
<rect width="680" height="360" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<line x1="30" y1="250" x2="650" y2="250" stroke="#5F5E5A" stroke-width="1.2"/>
<rect x="40" y="190" width="90" height="60" fill="#E1F5EE" stroke="#0F6E56" stroke-width=".8"/>
<rect x="170" y="140" width="90" height="110" fill="#E1F5EE" stroke="#0F6E56" stroke-width=".8"/>
<rect x="300" y="80" width="90" height="170" fill="#FAECE7" stroke="#993C1D" stroke-width=".8"/>
<rect x="430" y="34" width="90" height="216" fill="#FAECE7" stroke="#993C1D" stroke-width="1.4"/>
<rect x="560" y="20" width="90" height="230" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".8" stroke-dasharray="5 4"/>
<text class="th" x="85" y="274" text-anchor="middle" fill="#085041">1re famille</text>
<text class="ts" x="85" y="292" text-anchor="middle" fill="#0F6E56">R+1 au plus</text>
<text class="th" x="85" y="316" text-anchor="middle" fill="#2C2C2A">15 min</text>
<text class="th" x="215" y="274" text-anchor="middle" fill="#085041">2e famille</text>
<text class="ts" x="215" y="292" text-anchor="middle" fill="#0F6E56">collectif, R+3 au plus</text>
<text class="th" x="215" y="316" text-anchor="middle" fill="#2C2C2A">30 min</text>
<text class="th" x="345" y="274" text-anchor="middle" fill="#712B13">3e famille</text>
<text class="ts" x="345" y="292" text-anchor="middle" fill="#993C1D">jusqu'à 28 m</text>
<text class="th" x="345" y="316" text-anchor="middle" fill="#2C2C2A">1 h</text>
<text class="th" x="475" y="274" text-anchor="middle" fill="#712B13">4e famille</text>
<text class="ts" x="475" y="292" text-anchor="middle" fill="#993C1D">de 28 à 50 m</text>
<text class="th" x="475" y="316" text-anchor="middle" fill="#2C2C2A">1 h 30</text>
<text class="th" x="605" y="274" text-anchor="middle" fill="#444441">Plus de 50 m</text>
<text class="ts" x="605" y="292" text-anchor="middle" fill="#5F5E5A">IGH : règles propres</text>
<text class="ts" x="340" y="342" text-anchor="middle" fill="#5F5E5A">Stabilité au feu des éléments porteurs. Arbola (R+3) est en 2e famille ; avec un étage de plus, elle passe en 3e.</text>
</svg>
