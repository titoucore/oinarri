<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" role="img">
<title>Les trois voies de perte de chaleur</title>
<desc>Coupe d'un bâtiment. La chaleur s'échappe de trois façons : à travers les parois (toiture, murs, plancher bas, fenêtres), aux jonctions où l'isolant s'interrompt (ponts thermiques) et avec l'air, par les fuites.</desc>
<style>text{font-family:'Space Grotesk',system-ui,sans-serif}.th{font-size:14px;font-weight:500}.ts{font-size:12px}.nb{font-size:12px;font-weight:700}</style>
<defs>
<marker id="tv-a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0F6E56"/></marker>
<marker id="tv-c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5F5E5A"/></marker>
</defs>
<rect width="680" height="350" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<rect x="1" y="250" width="678" height="30" fill="#F1EFE8"/>
<line x1="1" y1="250" x2="679" y2="250" stroke="#5F5E5A" stroke-width="1.2"/>
<polygon points="190,110 340,50 490,110" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
<rect x="200" y="110" width="280" height="140" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="200" y1="180" x2="480" y2="180" stroke="#5F5E5A" stroke-width="1.2"/>
<rect x="472" y="125" width="8" height="40" fill="#E1F5EE" stroke="#0F6E56" stroke-width=".8"/>
<rect x="200" y="195" width="8" height="40" fill="#E1F5EE" stroke="#0F6E56" stroke-width=".8"/>
<path d="M300 100 V40" stroke="#0F6E56" stroke-width="3" fill="none" marker-end="url(#tv-a)"/>
<path d="M262 150 H168" stroke="#0F6E56" stroke-width="3" fill="none" marker-end="url(#tv-a)"/>
<path d="M440 145 H540" stroke="#0F6E56" stroke-width="3" fill="none" marker-end="url(#tv-a)"/>
<path d="M340 240 V290" stroke="#0F6E56" stroke-width="3" fill="none" marker-end="url(#tv-a)"/>
<circle cx="200" cy="180" r="18" fill="none" stroke="#993C1D" stroke-width="2.5" stroke-dasharray="5 3"/>
<circle cx="480" cy="180" r="18" fill="none" stroke="#993C1D" stroke-width="2.5" stroke-dasharray="5 3"/>
<circle cx="200" cy="112" r="18" fill="none" stroke="#993C1D" stroke-width="2.5" stroke-dasharray="5 3"/>
<path d="M120 225 H212" stroke="#5F5E5A" stroke-width="2.5" stroke-dasharray="6 4" fill="none" marker-end="url(#tv-c)"/>
<path d="M468 118 H548" stroke="#5F5E5A" stroke-width="2.5" stroke-dasharray="6 4" fill="none" marker-end="url(#tv-c)"/>
<circle cx="318" cy="34" r="11" fill="#0F6E56"/><text class="nb" x="318" y="38" text-anchor="middle" fill="#FFFFFF">1</text>
<circle cx="160" cy="162" r="11" fill="#993C1D"/><text class="nb" x="160" y="166" text-anchor="middle" fill="#FFFFFF">2</text>
<circle cx="100" cy="225" r="11" fill="#5F5E5A"/><text class="nb" x="100" y="229" text-anchor="middle" fill="#FFFFFF">3</text>
<circle cx="40" cy="305" r="11" fill="#0F6E56"/><text class="nb" x="40" y="309" text-anchor="middle" fill="#FFFFFF">1</text>
<text class="th" x="58" y="304" fill="#085041">À travers les parois</text>
<text class="ts" x="58" y="322" fill="#0F6E56">toiture, murs, plancher, fenêtres</text>
<circle cx="280" cy="305" r="11" fill="#993C1D"/><text class="nb" x="280" y="309" text-anchor="middle" fill="#FFFFFF">2</text>
<text class="th" x="298" y="304" fill="#712B13">Aux jonctions</text>
<text class="ts" x="298" y="322" fill="#993C1D">ponts thermiques</text>
<circle cx="450" cy="305" r="11" fill="#5F5E5A"/><text class="nb" x="450" y="309" text-anchor="middle" fill="#FFFFFF">3</text>
<text class="th" x="468" y="304" fill="#444441">Par l'air</text>
<text class="ts" x="468" y="322" fill="#5F5E5A">fuites (la ventilation est voulue)</text>
</svg>
