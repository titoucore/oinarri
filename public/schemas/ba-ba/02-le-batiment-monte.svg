<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 514" role="img">
<title>Les six étapes physiques d'un chantier de bâtiment</title>
<desc>Terrassement, fondations, structure, hors d'eau, hors d'air avec second œuvre, puis finitions. Les trois premières étapes laissent le bâtiment exposé à la pluie, les deux suivantes le mettent à l'abri. En vente en l'état futur d'achèvement, le vendeur peut appeler au plus 35 % du prix aux fondations achevées, 70 % à la mise hors d'eau et 95 % à l'achèvement.</desc>
<style>text{font-family:'Space Grotesk',system-ui,sans-serif}.th{font-size:14px;font-weight:500}.ts{font-size:12px}.num{font-size:12px;font-weight:500}</style>
<rect width="680" height="514" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<rect x="40" y="24" width="190" height="214" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width=".5"/>
<path d="M60 116 H102 V130 H168 V116 H210" stroke="#993C1D" stroke-width="1.5" fill="none" stroke-linejoin="round"/><path d="M102 116 V130 H168 V116 Z" fill="#993C1D" fill-opacity=".12" stroke="none"/><path d="M178 100 l14 -10 l8 6 l-6 10 z" fill="#993C1D" fill-opacity=".12" stroke="#993C1D" stroke-width="1.5" stroke-linejoin="round"/>
<circle cx="56" cy="40" r="10" fill="#fff" stroke="#993C1D" stroke-width=".8"/><text class="num" x="56" y="40" text-anchor="middle" dominant-baseline="central" fill="#712B13">1</text>
<text class="th" x="52" y="152" dominant-baseline="central" fill="#712B13">Terrassement</text>
<text class="ts" x="52" y="172" dominant-baseline="central" fill="#993C1D">On creuse et on</text>
<text class="ts" x="52" y="189" dominant-baseline="central" fill="#993C1D">prépare le terrain</text>
<rect x="245" y="24" width="190" height="214" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width=".5"/>
<path d="M265 116 H415" stroke="#993C1D" stroke-width="1.5" fill="none" stroke-linejoin="round"/><rect x="297" y="116" width="22" height="14" fill="#993C1D" fill-opacity=".12" stroke="#993C1D" stroke-width="1.5" stroke-linejoin="round"/><rect x="361" y="116" width="22" height="14" fill="#993C1D" fill-opacity=".12" stroke="#993C1D" stroke-width="1.5" stroke-linejoin="round"/><rect x="297" y="130" width="86" height="6" fill="#993C1D" fill-opacity=".12" stroke="#993C1D" stroke-width="1.5" stroke-linejoin="round"/><rect x="303" y="104" width="10" height="12" fill="#993C1D" fill-opacity=".12" stroke="#993C1D" stroke-width="1.5" stroke-linejoin="round"/><rect x="367" y="104" width="10" height="12" fill="#993C1D" fill-opacity=".12" stroke="#993C1D" stroke-width="1.5" stroke-linejoin="round"/>
<circle cx="261" cy="40" r="10" fill="#fff" stroke="#993C1D" stroke-width=".8"/><text class="num" x="261" y="40" text-anchor="middle" dominant-baseline="central" fill="#712B13">2</text>
<text class="th" x="257" y="152" dominant-baseline="central" fill="#712B13">Fondations</text>
<text class="ts" x="257" y="172" dominant-baseline="central" fill="#993C1D">Elles relient le</text>
<text class="ts" x="257" y="189" dominant-baseline="central" fill="#993C1D">bâtiment au sol</text>
<rect x="257" y="204" width="166" height="24" rx="12" fill="#fff" stroke="#993C1D" stroke-width=".8"/><text class="ts" x="340" y="216" text-anchor="middle" dominant-baseline="central" fill="#712B13">Jusqu'à 35 % du prix</text>
<rect x="450" y="24" width="190" height="214" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width=".5"/>
<path d="M470 116 H620" stroke="#993C1D" stroke-width="1.5" fill="none" stroke-linejoin="round"/><rect x="495" y="62" width="100" height="54" stroke="#993C1D" stroke-width="1.5" fill="none" stroke-linejoin="round"/><path d="M495 80 H595 M495 98 H595 M529 62 V116 M563 62 V116" stroke="#993C1D" stroke-width="1.5" fill="none" stroke-linejoin="round"/><path d="M516 32 l-6 14" stroke="#993C1D" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-dasharray="3 4"/><path d="M546 32 l-6 14" stroke="#993C1D" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-dasharray="3 4"/><path d="M576 32 l-6 14" stroke="#993C1D" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-dasharray="3 4"/><path d="M606 32 l-6 14" stroke="#993C1D" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-dasharray="3 4"/>
<circle cx="466" cy="40" r="10" fill="#fff" stroke="#993C1D" stroke-width=".8"/><text class="num" x="466" y="40" text-anchor="middle" dominant-baseline="central" fill="#712B13">3</text>
<text class="th" x="462" y="152" dominant-baseline="central" fill="#712B13">Structure</text>
<text class="ts" x="462" y="172" dominant-baseline="central" fill="#993C1D">Murs, planchers, escalier</text>
<text class="ts" x="462" y="189" dominant-baseline="central" fill="#993C1D">Encore ouvert à la pluie</text>
<rect x="40" y="250" width="190" height="214" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width=".5"/>
<path d="M60 342 H210" stroke="#0F6E56" stroke-width="1.5" fill="none" stroke-linejoin="round"/><rect x="85" y="288" width="100" height="54" fill="#0F6E56" fill-opacity=".12" stroke="#0F6E56" stroke-width="1.5" stroke-linejoin="round"/><path d="M79 288 L135.0 266 L191 288 Z" fill="#0F6E56" fill-opacity=".12" stroke="#0F6E56" stroke-width="1.5" stroke-linejoin="round"/>
<circle cx="56" cy="266" r="10" fill="#fff" stroke="#0F6E56" stroke-width=".8"/><text class="num" x="56" y="266" text-anchor="middle" dominant-baseline="central" fill="#085041">4</text>
<text class="th" x="52" y="378" dominant-baseline="central" fill="#085041">Hors d'eau</text>
<text class="ts" x="52" y="398" dominant-baseline="central" fill="#0F6E56">La toiture est posée</text>
<text class="ts" x="52" y="415" dominant-baseline="central" fill="#0F6E56">Il ne pleut plus dedans</text>
<rect x="52" y="430" width="166" height="24" rx="12" fill="#fff" stroke="#0F6E56" stroke-width=".8"/><text class="ts" x="135" y="442" text-anchor="middle" dominant-baseline="central" fill="#085041">Jusqu'à 70 % du prix</text>
<rect x="245" y="250" width="190" height="214" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width=".5"/>
<path d="M265 342 H415" stroke="#0F6E56" stroke-width="1.5" fill="none" stroke-linejoin="round"/><rect x="290" y="288" width="100" height="54" fill="#0F6E56" fill-opacity=".12" stroke="#0F6E56" stroke-width="1.5" stroke-linejoin="round"/><path d="M284 288 L340.0 266 L396 288 Z" fill="#0F6E56" fill-opacity=".12" stroke="#0F6E56" stroke-width="1.5" stroke-linejoin="round"/><rect x="300" y="296" width="14" height="12" fill="#fff" stroke="#0F6E56" stroke-width="1.2"/><rect x="328" y="296" width="14" height="12" fill="#fff" stroke="#0F6E56" stroke-width="1.2"/><rect x="356" y="296" width="14" height="12" fill="#fff" stroke="#0F6E56" stroke-width="1.2"/><rect x="300" y="314" width="14" height="12" fill="#fff" stroke="#0F6E56" stroke-width="1.2"/><rect x="356" y="314" width="14" height="12" fill="#fff" stroke="#0F6E56" stroke-width="1.2"/><rect x="334" y="322" width="12" height="20" fill="#fff" stroke="#0F6E56" stroke-width="1.2"/>
<circle cx="261" cy="266" r="10" fill="#fff" stroke="#0F6E56" stroke-width=".8"/><text class="num" x="261" y="266" text-anchor="middle" dominant-baseline="central" fill="#085041">5</text>
<text class="th" x="257" y="378" dominant-baseline="central" fill="#085041">Hors d'air</text>
<text class="ts" x="257" y="398" dominant-baseline="central" fill="#0F6E56">Fenêtres posées, puis</text>
<text class="ts" x="257" y="415" dominant-baseline="central" fill="#0F6E56">cloisons et réseaux</text>
<rect x="450" y="250" width="190" height="214" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".5"/>
<path d="M470 342 H620" stroke="#5F5E5A" stroke-width="1.5" fill="none" stroke-linejoin="round"/><rect x="495" y="288" width="100" height="54" fill="#5F5E5A" fill-opacity=".12" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/><path d="M489 288 L545.0 266 L601 288 Z" fill="#5F5E5A" fill-opacity=".12" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/><rect x="505" y="296" width="14" height="12" fill="#fff" stroke="#5F5E5A" stroke-width="1.2"/><rect x="533" y="296" width="14" height="12" fill="#fff" stroke="#5F5E5A" stroke-width="1.2"/><rect x="561" y="296" width="14" height="12" fill="#fff" stroke="#5F5E5A" stroke-width="1.2"/><rect x="505" y="314" width="14" height="12" fill="#fff" stroke="#5F5E5A" stroke-width="1.2"/><rect x="561" y="314" width="14" height="12" fill="#fff" stroke="#5F5E5A" stroke-width="1.2"/><rect x="539" y="322" width="12" height="20" fill="#fff" stroke="#5F5E5A" stroke-width="1.2"/><circle cx="612" cy="276" r="11" fill="#fff" stroke="#5F5E5A" stroke-width="1.5"/><path d="M606 276 l4 4 l8 -9" stroke="#5F5E5A" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
<circle cx="466" cy="266" r="10" fill="#fff" stroke="#5F5E5A" stroke-width=".8"/><text class="num" x="466" y="266" text-anchor="middle" dominant-baseline="central" fill="#444441">6</text>
<text class="th" x="462" y="378" dominant-baseline="central" fill="#444441">Finitions</text>
<text class="ts" x="462" y="398" dominant-baseline="central" fill="#5F5E5A">Peintures, sols, essais,</text>
<text class="ts" x="462" y="415" dominant-baseline="central" fill="#5F5E5A">puis réception</text>
<rect x="462" y="430" width="166" height="24" rx="12" fill="#fff" stroke="#5F5E5A" stroke-width=".8"/><text class="ts" x="545" y="442" text-anchor="middle" dominant-baseline="central" fill="#444441">Jusqu'à 95 % du prix</text>
<rect x="40" y="478" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width=".5"/><text class="ts" x="60" y="485" dominant-baseline="central" fill="#444441">Exposé à la pluie</text>
<rect x="186" y="478" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width=".5"/><text class="ts" x="206" y="485" dominant-baseline="central" fill="#444441">À l'abri : travaux intérieurs</text>
<rect x="400" y="478" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".5"/><text class="ts" x="420" y="485" dominant-baseline="central" fill="#444441">Terminé</text>
</svg>
