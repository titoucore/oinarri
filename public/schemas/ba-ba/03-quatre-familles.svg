dth="1.5" fill="none" stroke-linejoin="round"/><path d="M517 100 v14" stroke="#993C1D" stroke-width="1.5" fill="none" stroke-linejoin="round"/><path d="M541 100 v14" stroke="#993C1D" stroke-width="1.5" fill="none" stroke-linejoin="round"/><path d="M370 122 H620" stroke="#993C1D" stroke-width="1" opacity=".5"/>
<text class="th" x="366" y="152" dominant-baseline="central" fill="#712B13">Maçonnerie</text>
<text class="ts" x="366" y="174" dominant-baseline="central" fill="#993C1D">Blocs ou briques posés au mortier</text>
<text class="ts" x="366" y="192" dominant-baseline="central" fill="#993C1D">Murs porteurs, mise en œuvre simple</text>
<text class="ts" x="366" y="210" dominant-baseline="central" fill="#993C1D">À surveiller : ouvertures limitées</text>
<rect x="40" y="250" width="290" height="202" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".5"/>
<path d="M135 270 H235 M135 340 H235" stroke="#5F5E5A" stroke-width="3" fill="none"/><path d="M139.0 270 V340" stroke="#5F5E5A" stroke-width="1.5" fill="none" stroke-linejoin="round"/><path d="M157.4 270 V340" stroke="#5F5E5A" stroke-width="1.5" fill="none" stroke-linejoin="round"/><path d="M175.8 270 V340" stroke="#5F5E5A" stroke-width="1.5" fill="none" stroke-linejoin="round"/><path d="M194.2 270 V340" stroke="#5F5E5A" stroke-width="1.5" fill="none" stroke-linejoin="round"/><path d="M212.6 270 V340" stroke="#5F5E5A" stroke-width="1.5" fill="none" stroke-linejoin="round"/><path d="M231.0 270 V340" stroke="#5F5E5A" stroke-width="1.5" fill="none" stroke-linejoin="round"/><path d="M139 340 L231 270" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/><path d="M60 348 H310" stroke="#5F5E5A" stroke-width="1" opacity=".5"/>
<text class="th" x="56" y="378" dominant-baseline="central" fill="#444441">Bois</text>
<text class="ts" x="56" y="400" dominant-baseline="central" fill="#5F5E5A">Montants, poteaux-poutres ou panneaux</text>
<text class="ts" x="56" y="418" dominant-baseline="central" fill="#5F5E5A">Léger, adapté à la préfabrication</text>
<text class="ts" x="56" y="436" dominant-baseline="central" fill="#5F5E5A">À surveiller : humidité, feu, bruit</text>
<rect x="350" y="250" width="290" height="202" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width=".5"/>
<path d="M447 270 H459 M447 340 H459 M453 270 V340" stroke="#185FA5" stroke-width="2.5" fill="none"/><path d="M531 270 H543 M531 340 H543 M537 270 V340" stroke="#185FA5" stroke-width="2.5" fill="none"/><path d="M447 276 H543" stroke="#185FA5" stroke-width="3" fill="none"/><path d="M459 340 L531 280" stroke="#185FA5" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/><path d="M370 348 H620" stroke="#185FA5" stroke-width="1" opacity=".5"/>
<text class="th" x="366" y="378" dominant-baseline="central" fill="#0C447C">Métal</text>
<text class="ts" x="366" y="400" dominant-baseline="central" fill="#185FA5">Poteaux et poutres en acier</text>
<text class="ts" x="366" y="418" dominant-baseline="central" fill="#185FA5">Grandes portées, montage rapide</text>
<text class="ts" x="366" y="436" dominant-baseline="central" fill="#185FA5">À surveiller : feu, corrosion, bruit</text>
<text class="note" x="40" y="472">Traits généraux : chaque projet se calcule au cas par cas.</text>
</svg>
