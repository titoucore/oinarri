<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 486" role="img">
<title>Les quatre grandes familles de structure</title>
<desc>Béton armé, maçonnerie, bois et métal : pour chaque famille, un principe de construction, un point fort et un point d'attention.</desc>
<style>text{font-family:'Space Grotesk',system-ui,sans-serif}.th{font-size:14px;font-weight:500}.ts{font-size:12px}.note{font-size:12px;fill:#5F5E5A}</style>
