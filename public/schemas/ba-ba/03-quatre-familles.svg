<text class="th" x="56" y="152" dominant-baseline="central" fill="#085041">Béton armé</text>
<text class="ts" x="56" y="174" dominant-baseline="central" fill="#0F6E56">Coulé sur place ou préfabriqué</text>
<text class="ts" x="56" y="192" dominant-baseline="central" fill="#0F6E56">Béton pour comprimer, acier pour tirer</text>
<text class="ts" x="56" y="210" dominant-baseline="central" fill="#0F6E56">À surveiller : poids, temps de séchage</text>
<rect x="350" y="24" width="290" height="202" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width=".5"/>
