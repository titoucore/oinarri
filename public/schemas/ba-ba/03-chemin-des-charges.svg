<title>Le chemin des charges dans un bâtiment</title>
<desc>Les charges (neige, vent, occupants, poids propre) sont reçues par la toiture, passent par les planchers, descendent par les murs ou les poteaux, puis par les fondations jusqu'au sol.</desc>
