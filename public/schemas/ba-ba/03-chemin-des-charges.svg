<text class="note" x="420" y="396">Les charges descendent toujours</text>
<text class="note" x="420" y="412">jusqu'au sol.</text>
<text class="note" x="420" y="434">Le contreventement empêche le</text>
<text class="note" x="420" y="450">bâtiment de bouger au vent.</text>
