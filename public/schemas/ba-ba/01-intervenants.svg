<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img">
<title>Les intervenants d'une opération de construction</title>
<desc>Le maître d'ouvrage est relié au maître d'œuvre, au contrôleur technique, au coordonnateur SPS, au géotechnicien, aux entreprises et à l'assureur dommages-ouvrage. Le maître d'œuvre dirige l'exécution des entreprises.</desc>
<style>
text{font-family:'Space Grotesk',system-ui,sans-serif}
.th{font-size:14px;font-weight:500}
.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.leader{stroke:#888780;stroke-width:1;stroke-dasharray:4 3;fill:none}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}.gray .th{fill:#444441}.gray .ts{fill:#5F5E5A}
.teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}.teal .th{fill:#085041}.teal .ts{fill:#0F6E56}
.purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}.purple .th{fill:#3C3489}.purple .ts{fill:#534AB7}
.coral rect{fill:#FAECE7;stroke:#993C1D;stroke-width:.5}.coral .th{fill:#712B13}.coral .ts{fill:#993C1D}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="400" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<g class="gray"><rect x="240" y="24" width="200" height="60" rx="8"/><text class="th" x="340" y="46" text-anchor="middle" dominant-baseline="central">Maître d'ouvrage</text><text class="ts" x="340" y="66" text-anchor="middle" dominant-baseline="central">Il décide et finance</text></g>
<path d="M340 84 V108 M110 108 H572" class="arr"/>
<line x1="110" y1="108" x2="110" y2="128" class="arr" marker-end="url(#a)"/>
<line x1="264" y1="108" x2="264" y2="128" class="arr" marker-end="url(#a)"/>
<line x1="418" y1="108" x2="418" y2="128" class="arr" marker-end="url(#a)"/>
<line x1="572" y1="108" x2="572" y2="128" class="arr" marker-end="url(#a)"/>
<g class="teal"><rect x="40" y="130" width="140" height="62" rx="8"/><text class="th" x="110" y="152" text-anchor="middle" dominant-baseline="central">Maître d'œuvre</text><text class="ts" x="110" y="173" text-anchor="middle" dominant-baseline="central">Architecte, BET</text></g>
<g class="purple"><rect x="194" y="130" width="140" height="62" rx="8"/><text class="th" x="264" y="152" text-anchor="middle" dominant-baseline="central">Contrôleur</text><text class="ts" x="264" y="173" text-anchor="middle" dominant-baseline="central">Solidité, sécurité</text></g>
<g class="purple"><rect x="348" y="130" width="140" height="62" rx="8"/><text class="th" x="418" y="152" text-anchor="middle" dominant-baseline="central">Coordonnateur</text><text class="ts" x="418" y="173" text-anchor="middle" dominant-baseline="central">SPS, sécurité chantier</text></g>
<g class="teal"><rect x="502" y="130" width="140" height="62" rx="8"/><text class="th" x="572" y="152" text-anchor="middle" dominant-baseline="central">Géotechnicien</text><text class="ts" x="572" y="173" text-anchor="middle" dominant-baseline="central">Étude de sol</text></g>
<line x1="110" y1="192" x2="110" y2="260" class="leader"/>
<text class="ts" x="122" y="232">dirige l'exécution</text>
<path d="M240 54 H20 V292 H38" class="arr" marker-end="url(#a)"/>
<path d="M440 54 H660 V292 H644" class="arr" marker-end="url(#a)"/>
<g class="coral"><rect x="40" y="262" width="300" height="60" rx="8"/><text class="th" x="190" y="284" text-anchor="middle" dominant-baseline="central">Entreprises</text><text class="ts" x="190" y="304" text-anchor="middle" dominant-baseline="central">Un marché par lot ou une générale</text></g>
<g class="gray"><rect x="380" y="262" width="260" height="60" rx="8"/><text class="th" x="510" y="284" text-anchor="middle" dominant-baseline="central">Assureur</text><text class="ts" x="510" y="304" text-anchor="middle" dominant-baseline="central">Dommages-ouvrage</text></g>
<g class="gray"><rect x="40" y="352" width="12" height="12" rx="2"/></g><text class="ts" x="58" y="358" dominant-baseline="central">Décide, assure</text>
<g class="teal"><rect x="190" y="352" width="12" height="12" rx="2"/></g><text class="ts" x="208" y="358" dominant-baseline="central">Conçoit, étudie</text>
<g class="purple"><rect x="350" y="352" width="12" height="12" rx="2"/></g><text class="ts" x="368" y="358" dominant-baseline="central">Vérifie, coordonne</text>
<g class="coral"><rect x="520" y="352" width="12" height="12" rx="2"/></g><text class="ts" x="538" y="358" dominant-baseline="central">Construit</text>
</svg>
