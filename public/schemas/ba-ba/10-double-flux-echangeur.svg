<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img">
<title>La double flux : l'échangeur de chaleur</title>
<desc>Schéma de principe d'une ventilation double flux. L'air neuf extérieur (0 °C dans l'exemple) traverse un échangeur où il est réchauffé par l'air vicié qui sort du logement (20 °C), sans mélange entre les deux. Avec une récupération de 75 %, l'air neuf entre à environ 15 °C et l'air vicié sort à environ 5 °C.</desc>
<style>text{font-family:'Space Grotesk',system-ui,sans-serif}.th{font-size:14px;font-weight:500}.ts{font-size:12px}</style>
<defs>
<marker id="df-a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0F6E56"/></marker>
<marker id="df-b" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#993C1D"/></marker>
</defs>
<rect width="680" height="340" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<text class="th" x="90" y="58" text-anchor="middle" fill="#444441">Extérieur</text>
<rect x="520" y="80" width="130" height="170" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
<text class="th" x="585" y="58" text-anchor="middle" fill="#444441">Logement</text>
<rect x="270" y="110" width="150" height="120" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.5"/>
<text class="th" x="345" y="98" text-anchor="middle" fill="#444441">Échangeur</text>
<path d="M520 140 H280" stroke="#993C1D" stroke-width="4" fill="none" marker-end="url(#df-b)"/>
<path d="M270 140 H130" stroke="#993C1D" stroke-width="4" fill="none" marker-end="url(#df-b)"/>
<path d="M130 200 H410" stroke="#0F6E56" stroke-width="4" fill="none" marker-end="url(#df-a)"/>
<path d="M420 200 H510" stroke="#0F6E56" stroke-width="4" fill="none" marker-end="url(#df-a)"/>
<path d="M345 150 V190" stroke="#5F5E5A" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
<text class="ts" x="353" y="174" fill="#5F5E5A">chaleur</text>
<text class="ts" x="480" y="128" text-anchor="middle" fill="#993C1D">air vicié 20 °C</text>
<text class="ts" x="170" y="128" text-anchor="middle" fill="#993C1D">rejeté à 5 °C</text>
<text class="ts" x="170" y="224" text-anchor="middle" fill="#085041">air neuf 0 °C</text>
<text class="ts" x="470" y="224" text-anchor="middle" fill="#085041">insufflé à 15 °C</text>
<text class="th" x="340" y="278" text-anchor="middle" fill="#2C2C2A">Exemple : récupération de 75 %, extérieur 0 °C, intérieur 20 °C.</text>
<text class="ts" x="340" y="300" text-anchor="middle" fill="#5F5E5A">Les deux airs ne se mélangent pas : seule la chaleur passe.</text>
<text class="ts" x="340" y="320" text-anchor="middle" fill="#5F5E5A">Valeurs d'illustration (débits égaux).</text>
</svg>
