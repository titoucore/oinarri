<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 436" role="img">
<title>Du dépôt du permis au permis purgé</title>
<desc>Six étapes : dépôt du dossier, instruction de trois mois pour un collectif, décision, affichage continu de deux mois sur le terrain, délais de contestation (recours des tiers de deux mois, retrait de trois mois), permis purgé.</desc>
<style>text{font-family:'Space Grotesk',system-ui,sans-serif}.th{font-size:14px;font-weight:500}.ts{font-size:12px}</style>
<rect width="680" height="436" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<rect x="40" y="24" width="600" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width=".5"/>
<circle cx="64" cy="50" r="11" fill="#fff" stroke="#0F6E56" stroke-width=".8"/><text class="th" x="64" y="50" text-anchor="middle" dominant-baseline="central" fill="#085041">1</text>
<text class="th" x="88" y="42" dominant-baseline="central" fill="#085041">Dépôt du dossier</text><text class="ts" x="88" y="60" dominant-baseline="central" fill="#0F6E56">En mairie, avec le projet de l'architecte</text>
<path d="M64 77 V89" stroke="#0F6E56" stroke-width="1.5"/>
<rect x="40" y="90" width="600" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width=".5"/>
<circle cx="64" cy="116" r="11" fill="#fff" stroke="#0F6E56" stroke-width=".8"/><text class="th" x="64" y="116" text-anchor="middle" dominant-baseline="central" fill="#085041">2</text>
<text class="th" x="88" y="108" dominant-baseline="central" fill="#085041">Instruction</text><text class="ts" x="88" y="126" dominant-baseline="central" fill="#0F6E56">Trois mois pour un collectif ; sans réponse, le permis est tacite</text>
<path d="M64 143 V155" stroke="#0F6E56" stroke-width="1.5"/>
<rect x="40" y="156" width="600" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width=".5"/>
<circle cx="64" cy="182" r="11" fill="#fff" stroke="#0F6E56" stroke-width=".8"/><text class="th" x="64" y="182" text-anchor="middle" dominant-baseline="central" fill="#085041">3</text>
<text class="th" x="88" y="174" dominant-baseline="central" fill="#085041">Décision</text><text class="ts" x="88" y="192" dominant-baseline="central" fill="#0F6E56">Accord, accord avec prescriptions, ou refus</text>
<path d="M64 209 V221" stroke="#0F6E56" stroke-width="1.5"/>
<rect x="40" y="222" width="600" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width=".5"/>
<circle cx="64" cy="248" r="11" fill="#fff" stroke="#993C1D" stroke-width=".8"/><text class="th" x="64" y="248" text-anchor="middle" dominant-baseline="central" fill="#712B13">4</text>
<text class="th" x="88" y="240" dominant-baseline="central" fill="#712B13">Affichage sur le terrain</text><text class="ts" x="88" y="258" dominant-baseline="central" fill="#993C1D">Panneau visible et continu, avec la mention du droit de recours</text>
<path d="M64 275 V287" stroke="#993C1D" stroke-width="1.5"/>
<rect x="40" y="288" width="600" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width=".5"/>
<circle cx="64" cy="314" r="11" fill="#fff" stroke="#993C1D" stroke-width=".8"/><text class="th" x="64" y="314" text-anchor="middle" dominant-baseline="central" fill="#712B13">5</text>
<text class="th" x="88" y="306" dominant-baseline="central" fill="#712B13">Délais de contestation</text><text class="ts" x="88" y="324" dominant-baseline="central" fill="#993C1D">Recours des tiers : 2 mois d'affichage · Retrait : 3 mois après la décision</text>
<path d="M64 341 V353" stroke="#993C1D" stroke-width="1.5"/>
<rect x="40" y="354" width="600" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".5"/>
<circle cx="64" cy="380" r="11" fill="#fff" stroke="#5F5E5A" stroke-width=".8"/><text class="th" x="64" y="380" text-anchor="middle" dominant-baseline="central" fill="#444441">6</text>
<text class="th" x="88" y="372" dominant-baseline="central" fill="#444441">Permis purgé</text><text class="ts" x="88" y="390" dominant-baseline="central" fill="#5F5E5A">Plus de recours ni de retrait possible : on peut lever la condition</text>
</svg>
