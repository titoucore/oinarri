<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img">
<title>Ce que disent les retours d'expérience</title>
<desc>Les retours confirment un chantier plus court (8 à 14 mois contre 18), des performances de béton de chanvre comparables à la laine de bois, et l'absence de lien entre l'isolant et les composés organiques volatils. Ils signalent aussi à surveiller la ventilation, le vieillissement des façades bois, le risque de déshabillage du projet et des coûts mal connus.</desc>
<style>text{font-family:'Space Grotesk',system-ui,sans-serif}.th{font-size:14px;font-weight:500}.ts{font-size:12px}</style>
<rect width="680" height="330" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<rect x="30" y="24" width="300" height="220" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width=".5"/>
<text class="th" x="48" y="48" dominant-baseline="central" fill="#085041">Ce que les retours confirment</text>
<text class="ts" x="48" y="82" dominant-baseline="central" fill="#0F6E56">Chantier plus court : 8 à 14 mois</text>
<text class="ts" x="48" y="100" dominant-baseline="central" fill="#0F6E56">contre 18 en classique (étude 2016)</text>
<text class="ts" x="48" y="136" dominant-baseline="central" fill="#0F6E56">Béton de chanvre : performance</text>
<text class="ts" x="48" y="154" dominant-baseline="central" fill="#0F6E56">comparable à la laine de bois</text>
<text class="ts" x="48" y="172" dominant-baseline="central" fill="#0F6E56">(mesures du Cerema, 2025)</text>
<text class="ts" x="48" y="208" dominant-baseline="central" fill="#0F6E56">Pas de lien entre l'isolant et les</text>
<text class="ts" x="48" y="226" dominant-baseline="central" fill="#0F6E56">composés organiques volatils</text>
<rect x="350" y="24" width="300" height="220" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width=".5"/>
<text class="th" x="368" y="48" dominant-baseline="central" fill="#712B13">Ce qui reste à surveiller</text>
<text class="ts" x="368" y="82" dominant-baseline="central" fill="#993C1D">Ventilation défaillante dans la moitié</text>
<text class="ts" x="368" y="100" dominant-baseline="central" fill="#993C1D">des logements contrôlés</text>
<text class="ts" x="368" y="136" dominant-baseline="central" fill="#993C1D">Façade bois qui vieillit : les locataires</text>
<text class="ts" x="368" y="154" dominant-baseline="central" fill="#993C1D">peuvent être déçus</text>
<text class="ts" x="368" y="190" dominant-baseline="central" fill="#993C1D">Projet « déshabillé » en cours d'étude</text>
<text class="ts" x="368" y="226" dominant-baseline="central" fill="#993C1D">Coûts réels mal connus</text>
<rect x="30" y="264" width="620" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".5"/>
<text class="ts" x="48" y="284" dominant-baseline="central" fill="#5F5E5A">Ces retours viennent de peu d'opérations, souvent volontaires et pas toujours mesurées :</text>
<text class="ts" x="48" y="302" dominant-baseline="central" fill="#5F5E5A">à lire avec recul, jamais comme une moyenne.</text>
</svg>
