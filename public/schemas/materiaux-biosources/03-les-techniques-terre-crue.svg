<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img">
<title>Les trois familles de techniques en terre crue</title>
<desc>Porter avec le pisé, la bauge, l'adobe et le bloc de terre comprimée, remplir avec le torchis et la terre allégée, finir avec les enduits de terre.</desc>
<style>text{font-family:'Space Grotesk',system-ui,sans-serif}.th{font-size:14px;font-weight:500}.ts{font-size:12px}</style>
<rect width="680" height="330" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<rect x="40" y="24" width="600" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width=".5"/>
<text class="th" x="60" y="46" dominant-baseline="central" fill="#085041">Porter : des murs en terre</text><text class="ts" x="60" y="66" dominant-baseline="central" fill="#0F6E56">Pisé, bauge, adobe (brique de terre crue), bloc de terre comprimée (BTC)</text>
<path d="M340 85 V97" stroke="#0F6E56" stroke-width="1.5"/>
<rect x="40" y="98" width="600" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width=".5"/>
<text class="th" x="60" y="120" dominant-baseline="central" fill="#712B13">Remplir une ossature</text><text class="ts" x="60" y="140" dominant-baseline="central" fill="#993C1D">Torchis (sur pans de bois), terre allégée (terre et fibres ou granulats végétaux)</text>
<path d="M340 159 V171" stroke="#993C1D" stroke-width="1.5"/>
<rect x="40" y="172" width="600" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".5"/>
<text class="th" x="60" y="194" dominant-baseline="central" fill="#444441">Finir</text><text class="ts" x="60" y="214" dominant-baseline="central" fill="#5F5E5A">Enduits de terre, sur terre crue ou sur d'autres supports</text>
<text class="ts" x="340" y="262" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Six guides de bonnes pratiques couvrent ces techniques :</text>
<text class="ts" x="340" y="284" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">torchis, brique de terre crue, pisé, bauge, terre allégée, enduits de terre.</text>
</svg>
