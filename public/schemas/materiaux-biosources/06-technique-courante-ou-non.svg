<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img">
<title>Technique courante ou non courante</title>
<desc>Une technique est courante pour l'assureur quand elle dispose d'un référentiel produit, d'un référentiel de mise en œuvre et d'un usage dans son domaine d'emploi. Elle est alors couverte par défaut. Sinon elle est non courante : elle se déclare à l'assureur et reste assurable après analyse de risque.</desc>
<style>text{font-family:'Space Grotesk',system-ui,sans-serif}.th{font-size:14px;font-weight:500}.ts{font-size:12px}</style>
<rect width="680" height="330" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<rect x="30" y="24" width="300" height="190" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width=".5"/>
<text class="th" x="50" y="48" dominant-baseline="central" fill="#085041">Technique courante</text>
<text class="ts" x="50" y="72" dominant-baseline="central" fill="#0F6E56">Couverte par défaut par l'assurance</text>
<text class="ts" x="50" y="102" dominant-baseline="central" fill="#0F6E56">NF DTU et normes</text>
<text class="ts" x="50" y="122" dominant-baseline="central" fill="#0F6E56">Règles professionnelles acceptées C2P</text>
<text class="ts" x="50" y="142" dominant-baseline="central" fill="#0F6E56">Avis Technique en liste verte</text>
<text class="ts" x="50" y="162" dominant-baseline="central" fill="#0F6E56">ATEx favorable</text>
<text class="ts" x="50" y="182" dominant-baseline="central" fill="#0F6E56">Recommandations pro (grands programmes)</text>
<rect x="350" y="24" width="300" height="190" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width=".5"/>
<text class="th" x="370" y="48" dominant-baseline="central" fill="#712B13">Technique non courante</text>
<text class="ts" x="370" y="72" dominant-baseline="central" fill="#993C1D">À déclarer à l'assureur</text>
<text class="ts" x="370" y="102" dominant-baseline="central" fill="#993C1D">Pas de référentiel reconnu</text>
<text class="ts" x="370" y="122" dominant-baseline="central" fill="#993C1D">Avis Technique hors liste verte</text>
<text class="ts" x="370" y="142" dominant-baseline="central" fill="#993C1D">Règles non examinées ou non acceptées</text>
<text class="ts" x="370" y="162" dominant-baseline="central" fill="#993C1D">Usage hors du domaine d'emploi</text>
<text class="ts" x="370" y="182" dominant-baseline="central" fill="#993C1D">Assurable après analyse de risque</text>
<rect x="30" y="234" width="620" height="80" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".5"/>
<text class="th" x="50" y="256" dominant-baseline="central" fill="#444441">Trois conditions pour une technique courante</text>
<text class="ts" x="50" y="280" dominant-baseline="central" fill="#5F5E5A">Un référentiel produit + un référentiel de mise en œuvre</text>
<text class="ts" x="50" y="298" dominant-baseline="central" fill="#5F5E5A">+ un usage dans le domaine d'emploi prévu</text>
</svg>
