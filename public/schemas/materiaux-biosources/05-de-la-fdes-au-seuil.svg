<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img">
<title>De la FDES au seuil carbone</title>
<desc>Chaque produit a une donnée environnementale (FDES dans la base INIES, ou donnée par défaut). L'analyse de cycle de vie du bâtiment sur 50 ans les additionne en un Ic construction, comparé à un seuil qui dépend de l'année du permis. Le label biosourcé mesure autre chose : le carbone biogénique stocké.</desc>
<style>text{font-family:'Space Grotesk',system-ui,sans-serif}.th{font-size:14px;font-weight:500}.ts{font-size:12px}</style>
<rect width="680" height="330" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<rect x="30" y="30" width="140" height="100" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".5"/>
<text class="th" x="100" y="58" text-anchor="middle" dominant-baseline="central" fill="#444441">Le produit</text>
<text class="ts" x="100" y="84" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">FDES (INIES)</text>
<text class="ts" x="100" y="102" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">ou donnée par défaut</text>
<path d="M172 80 H186" stroke="#0F6E56" stroke-width="1.5"/>
<polygon points="184,75 192,80 184,85" fill="#0F6E56"/>
<rect x="194" y="30" width="140" height="100" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width=".5"/>
<text class="th" x="264" y="58" text-anchor="middle" dominant-baseline="central" fill="#085041">ACV du bâtiment</text>
<text class="ts" x="264" y="84" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">quantités × données</text>
<text class="ts" x="264" y="102" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">sur 50 ans</text>
<path d="M336 80 H350" stroke="#0F6E56" stroke-width="1.5"/>
<polygon points="348,75 356,80 348,85" fill="#0F6E56"/>
<rect x="358" y="30" width="140" height="100" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width=".5"/>
<text class="th" x="428" y="58" text-anchor="middle" dominant-baseline="central" fill="#085041">Ic construction</text>
<text class="ts" x="428" y="84" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">kg CO₂e par m²</text>
<text class="ts" x="428" y="102" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">produits + chantier</text>
<path d="M500 80 H514" stroke="#0F6E56" stroke-width="1.5"/>
<polygon points="512,75 520,80 512,85" fill="#0F6E56"/>
<rect x="522" y="30" width="128" height="100" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".5"/>
<text class="th" x="586" y="58" text-anchor="middle" dominant-baseline="central" fill="#444441">Le seuil</text>
<text class="ts" x="586" y="84" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">selon l'année</text>
<text class="ts" x="586" y="102" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">du permis</text>
<rect x="30" y="156" width="620" height="70" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width=".5"/>
<text class="th" x="50" y="178" dominant-baseline="central" fill="#712B13">Le piège</text>
<text class="ts" x="50" y="200" dominant-baseline="central" fill="#993C1D">Sans fiche propre au produit, le calcul prend une donnée par défaut, majorée :</text>
<text class="ts" x="50" y="216" dominant-baseline="central" fill="#993C1D">le projet est pénalisé. Il faut demander les FDES dès la conception.</text>
<rect x="30" y="246" width="620" height="68" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".5"/>
<text class="th" x="50" y="266" dominant-baseline="central" fill="#444441">Ne pas confondre</text>
<text class="ts" x="50" y="288" dominant-baseline="central" fill="#5F5E5A">Le label bâtiment biosourcé mesure le carbone biogénique stocké (kgC par m²),</text>
<text class="ts" x="50" y="303" dominant-baseline="central" fill="#5F5E5A">pas l'Ic construction. C'est un label volontaire, pas une exigence de la RE2020.</text>
</svg>
