<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img">
<title>Réversibilité, évolutivité, démontabilité</title>
<desc>Trois notions voisines selon l'Agence Qualité Construction : la réversibilité est la capacité à changer d'usage, l'évolutivité ou modularité est l'adaptation au sein du même bâtiment, la démontabilité est la capacité à être démonté sans destruction. Les freins sont l'incendie, l'acoustique, la fiscalité et l'urbanisme.</desc>
<style>text{font-family:'Space Grotesk',system-ui,sans-serif}.th{font-size:14px;font-weight:500}.ts{font-size:12px}</style>
<rect width="680" height="330" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<rect x="30" y="24" width="190" height="122" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width=".5"/>
<text class="th" x="46" y="46" dominant-baseline="central" fill="#085041">Réversibilité</text>
<text class="ts" x="46" y="72" dominant-baseline="central" fill="#0F6E56">Changer d'usage</text>
<text class="ts" x="46" y="94" dominant-baseline="central" fill="#0F6E56">Exemple : des bureaux</text>
<text class="ts" x="46" y="112" dominant-baseline="central" fill="#0F6E56">qui deviennent des logements</text>
<rect x="245" y="24" width="190" height="122" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".5"/>
<text class="th" x="261" y="46" dominant-baseline="central" fill="#444441">Évolutivité</text>
<text class="ts" x="261" y="72" dominant-baseline="central" fill="#5F5E5A">S'adapter dans le même</text>
<text class="ts" x="261" y="90" dominant-baseline="central" fill="#5F5E5A">bâtiment (modularité)</text>
<text class="ts" x="261" y="112" dominant-baseline="central" fill="#5F5E5A">Exemple : cloisons mobiles</text>
<rect x="460" y="24" width="190" height="122" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".5"/>
<text class="th" x="476" y="46" dominant-baseline="central" fill="#444441">Démontabilité</text>
<text class="ts" x="476" y="72" dominant-baseline="central" fill="#5F5E5A">Démonter sans détruire,</text>
<text class="ts" x="476" y="90" dominant-baseline="central" fill="#5F5E5A">pour déplacer ou restituer</text>
<text class="ts" x="476" y="108" dominant-baseline="central" fill="#5F5E5A">le site à son état d'origine</text>
<rect x="30" y="166" width="620" height="84" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width=".5"/>
<text class="th" x="48" y="188" dominant-baseline="central" fill="#712B13">Ce qui freine</text>
<text class="ts" x="48" y="212" dominant-baseline="central" fill="#993C1D">Sécurité incendie (l'effectif des bureaux est plus élevé qu'en logement), acoustique</text>
<text class="ts" x="48" y="230" dominant-baseline="central" fill="#993C1D">(plus stricte en logement), fiscalité (TVA) et règles d'urbanisme.</text>
<rect x="30" y="266" width="620" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width=".5"/>
<text class="ts" x="48" y="284" dominant-baseline="central" fill="#0F6E56">À décider dès la programmation et la conception : après coup, la transformation</text>
<text class="ts" x="48" y="302" dominant-baseline="central" fill="#0F6E56">coûte plus cher et se heurte aux règles.</text>
</svg>
