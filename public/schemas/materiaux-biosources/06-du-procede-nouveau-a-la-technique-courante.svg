<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img">
<title>Du procédé nouveau à la technique courante</title>
<desc>Un procédé nouveau peut passer par une ATEx délivrée par le CSTB, puis par un Avis Technique, et entrer en liste verte de la C2P, ce qui le rend technique courante. Les professionnels peuvent aussi rédiger des règles professionnelles que la C2P examine.</desc>
<style>text{font-family:'Space Grotesk',system-ui,sans-serif}.th{font-size:14px;font-weight:500}.ts{font-size:12px}</style>
<rect width="680" height="330" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<rect x="30" y="30" width="140" height="100" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".5"/>
<text class="th" x="100" y="58" text-anchor="middle" dominant-baseline="central" fill="#444441">Procédé nouveau</text>
<text class="ts" x="100" y="84" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">pas de référentiel</text>
<text class="ts" x="100" y="102" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">technique non courante</text>
<path d="M172 80 H186" stroke="#0F6E56" stroke-width="1.5"/>
<polygon points="184,75 192,80 184,85" fill="#0F6E56"/>
<rect x="194" y="30" width="140" height="100" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width=".5"/>
<text class="th" x="264" y="58" text-anchor="middle" dominant-baseline="central" fill="#085041">ATEx</text>
<text class="ts" x="264" y="84" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">délivrée par le CSTB</text>
<text class="ts" x="264" y="102" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">cas A, B ou C</text>
<path d="M336 80 H350" stroke="#0F6E56" stroke-width="1.5"/>
<polygon points="348,75 356,80 348,85" fill="#0F6E56"/>
<rect x="358" y="30" width="140" height="100" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width=".5"/>
<text class="th" x="428" y="58" text-anchor="middle" dominant-baseline="central" fill="#085041">Avis Technique</text>
<text class="ts" x="428" y="84" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">instruit par le CSTB</text>
<text class="ts" x="428" y="102" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">validé par la CCFAT</text>
<path d="M500 80 H514" stroke="#0F6E56" stroke-width="1.5"/>
<polygon points="512,75 520,80 512,85" fill="#0F6E56"/>
<rect x="522" y="30" width="128" height="100" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".5"/>
<text class="th" x="586" y="58" text-anchor="middle" dominant-baseline="central" fill="#444441">Liste verte</text>
<text class="ts" x="586" y="84" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">examen de la C2P</text>
<text class="ts" x="586" y="102" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">technique courante</text>
<rect x="30" y="156" width="620" height="70" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".5"/>
<text class="th" x="50" y="178" dominant-baseline="central" fill="#444441">Les trois cas d'ATEx</text>
<text class="ts" x="50" y="200" dominant-baseline="central" fill="#5F5E5A">A : plusieurs chantiers, demandée en général par l'industriel. B : un chantier précis.</text>
<text class="ts" x="50" y="216" dominant-baseline="central" fill="#5F5E5A">C : reprise d'une ATEx de cas B sur un autre chantier, par son titulaire.</text>
<rect x="30" y="246" width="620" height="68" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width=".5"/>
<text class="th" x="50" y="266" dominant-baseline="central" fill="#085041">Une autre voie : les règles professionnelles</text>
<text class="ts" x="50" y="288" dominant-baseline="central" fill="#0F6E56">La filière les rédige (paille, enduits de terre…), la C2P les examine.</text>
<text class="ts" x="50" y="303" dominant-baseline="central" fill="#0F6E56">Acceptées, elles rendent la technique courante pour les assureurs.</text>
</svg>
