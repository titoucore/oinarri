<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img">
<title>De la demande de logement à l'attribution</title>
<desc>Cinq étapes : la demande de logement, renouvelée chaque année ; la vérification des plafonds de ressources d'après l'avis d'imposition de l'année N-2 ; la proposition de candidats par les réservataires et le bailleur ; la décision de la commission d'attribution, qui examine au moins trois candidatures par logement et motive ses refus ; enfin le bail, avec un surloyer possible si les ressources dépassent de 20 % les plafonds.</desc>
<style>text{font-family:'Space Grotesk',system-ui,sans-serif}.th{font-size:14px;font-weight:500}.ts{font-size:12px}</style>
<defs>
<marker id="at-a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5F5E5A"/></marker>
</defs>
<rect width="680" height="330" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<rect x="10" y="40" width="116" height="140" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".8"/>
<rect x="146" y="40" width="116" height="140" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".8"/>
<rect x="282" y="40" width="116" height="140" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".8"/>
<rect x="418" y="40" width="116" height="140" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/>
<rect x="554" y="40" width="116" height="140" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".8"/>
<path d="M128 110 H144" stroke="#5F5E5A" stroke-width="2" fill="none" marker-end="url(#at-a)"/>
<path d="M264 110 H280" stroke="#5F5E5A" stroke-width="2" fill="none" marker-end="url(#at-a)"/>
<path d="M400 110 H416" stroke="#5F5E5A" stroke-width="2" fill="none" marker-end="url(#at-a)"/>
<path d="M536 110 H552" stroke="#5F5E5A" stroke-width="2" fill="none" marker-end="url(#at-a)"/>
<text class="th" x="68" y="66" text-anchor="middle" fill="#2C2C2A">1 Demande</text>
<text class="ts" x="68" y="94" text-anchor="middle" fill="#5F5E5A">Demande de</text>
<text class="ts" x="68" y="110" text-anchor="middle" fill="#5F5E5A">logement,</text>
<text class="ts" x="68" y="126" text-anchor="middle" fill="#5F5E5A">renouvelée</text>
<text class="ts" x="68" y="142" text-anchor="middle" fill="#5F5E5A">chaque année</text>
<text class="th" x="204" y="66" text-anchor="middle" fill="#2C2C2A">2 Plafonds</text>
<text class="ts" x="204" y="94" text-anchor="middle" fill="#5F5E5A">Ressources sous</text>
<text class="ts" x="204" y="110" text-anchor="middle" fill="#5F5E5A">les plafonds</text>
<text class="ts" x="204" y="126" text-anchor="middle" fill="#5F5E5A">(avis d'impôt</text>
<text class="ts" x="204" y="142" text-anchor="middle" fill="#5F5E5A">de l'année N-2)</text>
<text class="th" x="340" y="66" text-anchor="middle" fill="#2C2C2A">3 Candidats</text>
<text class="ts" x="340" y="94" text-anchor="middle" fill="#5F5E5A">Réservataires</text>
<text class="ts" x="340" y="110" text-anchor="middle" fill="#5F5E5A">et bailleur</text>
<text class="ts" x="340" y="126" text-anchor="middle" fill="#5F5E5A">proposent des</text>
<text class="ts" x="340" y="142" text-anchor="middle" fill="#5F5E5A">candidatures</text>
<text class="th" x="476" y="66" text-anchor="middle" fill="#085041">4 CALEOL</text>
<text class="ts" x="476" y="94" text-anchor="middle" fill="#0F6E56">Au moins 3</text>
<text class="ts" x="476" y="110" text-anchor="middle" fill="#0F6E56">candidatures</text>
<text class="ts" x="476" y="126" text-anchor="middle" fill="#0F6E56">par logement ;</text>
<text class="ts" x="476" y="142" text-anchor="middle" fill="#0F6E56">refus motivé</text>
<text class="th" x="612" y="66" text-anchor="middle" fill="#2C2C2A">5 Bail</text>
<text class="ts" x="612" y="94" text-anchor="middle" fill="#5F5E5A">Puis surloyer</text>
<text class="ts" x="612" y="110" text-anchor="middle" fill="#5F5E5A">possible si les</text>
<text class="ts" x="612" y="126" text-anchor="middle" fill="#5F5E5A">ressources dé-</text>
<text class="ts" x="612" y="142" text-anchor="middle" fill="#5F5E5A">passent de 20 %</text>
<text class="th" x="340" y="216" text-anchor="middle" fill="#2C2C2A">C'est la commission qui décide, logement par logement.</text>
<text class="ts" x="340" y="240" text-anchor="middle" fill="#5F5E5A">Respecter les plafonds est nécessaire, pas suffisant : la commission tient compte du foyer et des priorités.</text>
<text class="ts" x="340" y="262" text-anchor="middle" fill="#5F5E5A">Au moins 25 % des attributions non réservées vont à des ménages DALO ou prioritaires.</text>
<text class="ts" x="340" y="284" text-anchor="middle" fill="#5F5E5A">Loyer et surloyer cumulés : 30 % des ressources du foyer au plus.</text>
<text class="ts" x="340" y="310" text-anchor="middle" fill="#5F5E5A">Plafonds PLUS, PLS (PLUS plus 30 %) et surloyer : voir les chiffres du chapitre.</text>
</svg>
