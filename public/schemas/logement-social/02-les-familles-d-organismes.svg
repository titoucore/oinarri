<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" role="img">
<title>Les familles d'organismes de logement social</title>
<desc>Trois familles d'organismes HLM : les offices publics de l'habitat (180 en 2023), les entreprises sociales pour l'habitat (172) et les coopératives d'HLM (162). Les SEM agréées et les SACICAP (46) ne sont pas des organismes HLM. Tous sont réunis autour de l'Union sociale pour l'habitat, créée en 1929.</desc>
<style>text{font-family:'Space Grotesk',system-ui,sans-serif}.th{font-size:14px;font-weight:500}.ts{font-size:12px}</style>
<rect width="680" height="350" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<rect x="40" y="20" width="600" height="36" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".8"/>
<text class="th" x="340" y="43" text-anchor="middle" fill="#2C2C2A">Union sociale pour l'habitat (USH), créée en 1929</text>
<rect x="40" y="76" width="420" height="190" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width=".8"/>
<text class="th" x="56" y="98" fill="#085041">Organismes HLM</text>
<rect x="56" y="110" width="124" height="144" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width=".8"/>
<text class="th" x="118" y="132" text-anchor="middle" fill="#085041">OPH</text>
<text class="ts" x="118" y="152" text-anchor="middle" fill="#0F6E56">Office public</text>
<text class="ts" x="118" y="168" text-anchor="middle" fill="#0F6E56">de l'habitat</text>
<text class="ts" x="118" y="192" text-anchor="middle" fill="#5F5E5A">rattaché à une</text>
<text class="ts" x="118" y="208" text-anchor="middle" fill="#5F5E5A">collectivité</text>
<text class="th" x="118" y="234" text-anchor="middle" fill="#2C2C2A">180</text>
<text class="ts" x="118" y="248" text-anchor="middle" fill="#5F5E5A">en 2023</text>
<rect x="190" y="110" width="124" height="144" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width=".8"/>
<text class="th" x="252" y="132" text-anchor="middle" fill="#085041">ESH</text>
<text class="ts" x="252" y="152" text-anchor="middle" fill="#0F6E56">Entreprise sociale</text>
<text class="ts" x="252" y="168" text-anchor="middle" fill="#0F6E56">pour l'habitat</text>
<text class="ts" x="252" y="192" text-anchor="middle" fill="#5F5E5A">société anonyme,</text>
<text class="ts" x="252" y="208" text-anchor="middle" fill="#5F5E5A">avec actionnaires</text>
<text class="th" x="252" y="234" text-anchor="middle" fill="#2C2C2A">172</text>
<text class="ts" x="252" y="248" text-anchor="middle" fill="#5F5E5A">en 2023</text>
<rect x="324" y="110" width="124" height="144" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width=".8"/>
<text class="th" x="386" y="132" text-anchor="middle" fill="#085041">Coopérative</text>
<text class="ts" x="386" y="152" text-anchor="middle" fill="#0F6E56">d'HLM, société</text>
<text class="ts" x="386" y="168" text-anchor="middle" fill="#0F6E56">coopérative</text>
<text class="ts" x="386" y="192" text-anchor="middle" fill="#5F5E5A">très présente en</text>
<text class="ts" x="386" y="208" text-anchor="middle" fill="#5F5E5A">accession sociale</text>
<text class="th" x="386" y="234" text-anchor="middle" fill="#2C2C2A">162</text>
<text class="ts" x="386" y="248" text-anchor="middle" fill="#5F5E5A">en 2023</text>
<rect x="480" y="76" width="160" height="190" rx="10" fill="#FFFFFF" stroke="#5F5E5A" stroke-width=".8" stroke-dasharray="5 4"/>
<text class="th" x="496" y="98" fill="#444441">Pas des organismes HLM</text>
<rect x="494" y="110" width="132" height="66" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".8"/>
<text class="th" x="560" y="130" text-anchor="middle" fill="#2C2C2A">SEM agréée</text>
<text class="ts" x="560" y="148" text-anchor="middle" fill="#5F5E5A">logements sociaux,</text>
<text class="ts" x="560" y="164" text-anchor="middle" fill="#5F5E5A">comptabilité distincte</text>
<rect x="494" y="188" width="132" height="66" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".8"/>
<text class="th" x="560" y="208" text-anchor="middle" fill="#2C2C2A">SACICAP</text>
<text class="ts" x="560" y="226" text-anchor="middle" fill="#5F5E5A">adhère à l'USH</text>
<text class="ts" x="560" y="242" text-anchor="middle" fill="#5F5E5A">46 en 2023</text>
<text class="th" x="340" y="294" text-anchor="middle" fill="#2C2C2A">Environ 560 organismes fin 2023, 4,8 millions de logements (USH).</text>
<text class="ts" x="340" y="316" text-anchor="middle" fill="#5F5E5A">Loi ELAN : en dessous de 12 000 logements, un organisme rejoint un groupe.</text>
<text class="ts" x="340" y="334" text-anchor="middle" fill="#5F5E5A">Chiffres de 2023 : ils bougent avec les fusions.</text>
</svg>
