<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" role="img">
<title>PLAI, PLUS et PLS en un coup d'œil</title>
<desc>Trois colonnes comparent le public, le taux du prêt de la Banque des Territoires, la subvention et la TVA : PLAI très social, PLUS social ordinaire, PLS intermédiaire.</desc>
<style>text{font-family:'Space Grotesk',system-ui,sans-serif}.th{font-size:15px;font-weight:500}.ts{font-size:12px}</style>
<rect width="680" height="440" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<rect x="24" y="24" width="206" height="392" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width=".5"/>
<text class="th" x="127" y="50" text-anchor="middle" fill="#085041">PLAI</text>
<text class="ts" x="127" y="72" text-anchor="middle" fill="#0F6E56">Très social</text>
<text class="ts" x="127" y="112" text-anchor="middle" fill="#085041">Prêt</text><text class="ts" x="127" y="130" text-anchor="middle" fill="#0F6E56">Livret A moins 0,20 %</text>
<text class="ts" x="127" y="170" text-anchor="middle" fill="#085041">Subvention</text><text class="ts" x="127" y="188" text-anchor="middle" fill="#0F6E56">Oui</text>
<text class="ts" x="127" y="228" text-anchor="middle" fill="#085041">TVA</text><text class="ts" x="127" y="246" text-anchor="middle" fill="#0F6E56">5,5 %</text>
<text class="ts" x="127" y="286" text-anchor="middle" fill="#085041">Loyer de zone II (2026)</text><text class="ts" x="127" y="304" text-anchor="middle" fill="#0F6E56">5,77 euros par m2</text>
<text class="ts" x="127" y="344" text-anchor="middle" fill="#085041">Marge locale</text><text class="ts" x="127" y="362" text-anchor="middle" fill="#0F6E56">Jusqu'à 15 %</text>
<rect x="237" y="24" width="206" height="392" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width=".5"/>
<text class="th" x="340" y="50" text-anchor="middle" fill="#712B13">PLUS</text>
<text class="ts" x="340" y="72" text-anchor="middle" fill="#993C1D">Social ordinaire</text>
<text class="ts" x="340" y="112" text-anchor="middle" fill="#712B13">Prêt</text><text class="ts" x="340" y="130" text-anchor="middle" fill="#993C1D">Livret A plus 0,60 %</text>
<text class="ts" x="340" y="170" text-anchor="middle" fill="#712B13">Subvention</text><text class="ts" x="340" y="188" text-anchor="middle" fill="#993C1D">Selon le territoire</text>
<text class="ts" x="340" y="228" text-anchor="middle" fill="#712B13">TVA</text><text class="ts" x="340" y="246" text-anchor="middle" fill="#993C1D">10 % (5,5 % en renouvellement urbain)</text>
<text class="ts" x="340" y="286" text-anchor="middle" fill="#712B13">Loyer de zone II (2026)</text><text class="ts" x="340" y="304" text-anchor="middle" fill="#993C1D">6,49 euros par m2</text>
<text class="ts" x="340" y="344" text-anchor="middle" fill="#712B13">Marge locale</text><text class="ts" x="340" y="362" text-anchor="middle" fill="#993C1D">Jusqu'à 15 %</text>
<rect x="450" y="24" width="206" height="392" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".5"/>
<text class="th" x="553" y="50" text-anchor="middle" fill="#444441">PLS</text>
<text class="ts" x="553" y="72" text-anchor="middle" fill="#5F5E5A">Intermédiaire</text>
<text class="ts" x="553" y="112" text-anchor="middle" fill="#444441">Prêt</text><text class="ts" x="553" y="130" text-anchor="middle" fill="#5F5E5A">Livret A plus 1,11 %</text>
<text class="ts" x="553" y="170" text-anchor="middle" fill="#444441">Subvention</text><text class="ts" x="553" y="188" text-anchor="middle" fill="#5F5E5A">Non</text>
<text class="ts" x="553" y="228" text-anchor="middle" fill="#444441">TVA</text><text class="ts" x="553" y="246" text-anchor="middle" fill="#5F5E5A">10 %</text>
<text class="ts" x="553" y="286" text-anchor="middle" fill="#444441">Loyer maximal (2026)</text><text class="ts" x="553" y="304" text-anchor="middle" fill="#5F5E5A">9,03 à 15,32 euros par m2 selon la zone</text>
<text class="ts" x="553" y="344" text-anchor="middle" fill="#444441">Marge locale</text><text class="ts" x="553" y="362" text-anchor="middle" fill="#5F5E5A">Aucune</text>
<text class="ts" x="340" y="432" text-anchor="middle" fill="#5F5E5A">Valeurs vérifiées le 3 octobre 2026 : à revérifier chaque année</text>
</svg>
